<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayo's SAT Question of the Day</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f8f9fa;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .test-header {
      min-height: 74px;
      padding: 1rem 2rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
    }

    .section-title { font-size: .95rem; font-weight: 600; }
    .header-center { text-align: center; color: #555; }
    .header-date { font-size: .78rem; }
    .timer-display {
      margin-top: .2rem;
      color: #222;
      font-size: 1.2rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    .timer-display[hidden] { display: none; }
    .timer-display.warning { color: #c62828; }

    .user-profile {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: .6rem;
      font-size: .85rem;
      font-weight: 600;
    }

    .user-profile img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 50%;
    }

    .practice-banner {
      padding: .42rem;
      background: #3d5a96;
      color: #fff;
      text-align: center;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .dotted-border {
      height: 12px;
      flex-shrink: 0;
      background-image: repeating-linear-gradient(
        to right,
        #666 0,
        #666 6px,
        transparent 6px,
        transparent 12px
      );
      background-position: 0 50%;
      background-size: 12px 2px;
      background-repeat: repeat-x;
    }

    .test-content {
      min-height: 0;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 4px 400px;
      background: #fff;
    }

    .question-area {
      padding: 2rem 2.75rem;
      overflow-y: auto;
      background: #fff;
    }

    .question-content {
      max-width: 760px;
      margin: 0 auto;
      color: #222;
      font: 1.05rem/1.65 Georgia, "Times New Roman", serif;
    }

    .question-kicker {
      margin-bottom: 1rem;
      color: #666;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .question-image {
      display: block;
      max-width: 100%;
      max-height: 55vh;
      margin: 1.25rem auto;
      object-fit: contain;
    }

    .vertical-divider {
      width: 4px;
      position: relative;
      background: #d0d0d0;
      cursor: col-resize;
      user-select: none;
    }

    .vertical-divider:hover { background: #999; }

    .answer-sidebar {
      padding: 1.5rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      background: #fafafa;
    }

    .question-header-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .question-number-badge {
      padding: .4rem .7rem;
      border-radius: 8px;
      background: #1a1a1a;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
    }

    .tools { display: flex; align-items: center; gap: .65rem; }

    .tool-btn {
      border: 0;
      background: transparent;
      color: #666;
      cursor: pointer;
      font: inherit;
      font-size: .82rem;
    }

    .tool-btn.active { color: #c41e3a; font-weight: 700; }

    .eliminator {
      padding: .25rem .42rem;
      border-radius: 6px;
      background: #4169e1;
      color: #fff;
      font-size: .7rem;
      font-weight: 700;
    }

    .divider-line { height: 1px; background: #ddd; }

    .question-prompt {
      margin-bottom: .25rem;
      color: #333;
      font-size: .93rem;
      font-weight: 500;
      line-height: 1.45;
    }

    .answer-choices { display: flex; flex-direction: column; gap: .65rem; }

    .choice-row { display: flex; align-items: center; gap: .5rem; }

    .choice-option {
      min-height: 52px;
      padding: .8rem;
      flex: 1;
      display: flex;
      align-items: center;
      gap: .8rem;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, background .15s;
    }

    .choice-option:hover { border-color: #4169e1; }
    .choice-option.selected { border-color: #4169e1; background: #e8f0fe; }
    .choice-option.eliminated { opacity: .48; }
    .choice-option.eliminated .choice-text { text-decoration: line-through; }

    .choice-letter {
      width: 25px;
      height: 25px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border: 1px solid #ccc;
      border-radius: 50%;
      background: #f5f5f5;
      color: #333;
      font-size: .8rem;
      font-weight: 700;
    }

    .choice-option.selected .choice-letter {
      border-color: #4169e1;
      background: #4169e1;
      color: #fff;
    }

    .choice-text { font-size: .87rem; line-height: 1.4; }

    .choice-explanation {
      display: none;
      margin: .1rem .2rem .35rem 2.65rem;
      color: #555;
      font-size: .8rem;
      line-height: 1.4;
    }

    .choice-explanation.visible { display: block; }
    .choice-explanation.correct { color: #18794e; }

    .eliminate-choice {
      width: 30px;
      height: 30px;
      display: none;
      flex-shrink: 0;
      border: 1px solid #bbb;
      border-radius: 50%;
      background: #fff;
      color: #666;
      cursor: pointer;
      font-weight: 700;
    }

    .eliminating .eliminate-choice { display: block; }

    .status {
      min-height: 1.3rem;
      color: #555;
      font-size: .84rem;
      line-height: 1.35;
    }

    .status.error { color: #b42318; }
    .status.correct { color: #18794e; font-weight: 700; }

    .test-footer {
      min-height: 62px;
      padding: .75rem 2rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: #2c3e50;
      color: #fff;
    }

    .footer-user { font-size: .9rem; font-weight: 500; }

    .question-indicator {
      padding: .5rem .85rem;
      border-radius: 20px;
      background: #1a1a1a;
      font-size: .8rem;
      font-weight: 600;
    }

    .submit-btn {
      justify-self: end;
      padding: .55rem 1.3rem;
      border: 0;
      border-radius: 20px;
      background: #4169e1;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .submit-btn:hover:not(:disabled) { background: #365ec7; }
    .submit-btn:disabled { opacity: .5; cursor: not-allowed; }

    @media (max-width: 768px) {
      body { min-height: 100vh; height: auto; overflow: auto; }
      .test-header { padding: .8rem 1rem; grid-template-columns: 1fr auto; }
      .header-date { display: none; }
      .test-content { display: flex; flex-direction: column; }
      .vertical-divider { display: none; }
      .question-area { min-height: 42vh; padding: 1.35rem; }
      .answer-sidebar { border-top: 2px solid #d0d0d0; padding: 1.25rem; }
      .test-footer { position: sticky; bottom: 0; padding: .75rem 1rem; }
      .question-indicator { display: none; }
    }
  </style>
</head>
<body>
  <header class="test-header">
    <div class="section-title">SAT Question of the Day</div>
    <div class="header-center">
      <div class="header-date" id="dateDisplay"></div>
      <div class="timer-display" id="timerDisplay" hidden></div>
    </div>
    <div class="user-profile" id="userProfile"></div>
  </header>

  <div class="practice-banner">MAYO'S DAILY SAT PRACTICE</div>
  <div class="dotted-border"></div>

  <main class="test-content" id="testContent">
    <section class="question-area">
      <div class="question-content">
        <div class="question-kicker">Question passage</div>
        <div id="questionStimulus">Loading today’s question…</div>
        <img class="question-image" id="questionImage" alt="" hidden>
      </div>
    </section>

    <div class="vertical-divider" id="divider"></div>

    <aside class="answer-sidebar" id="answerSidebar">
      <div class="question-header-section">
        <span class="question-number-badge">1</span>
        <div class="tools">
          <button class="tool-btn" id="bookmarkBtn" type="button">♡ Mark for Review</button>
          <button class="tool-btn eliminator" id="eliminatorBtn" type="button">ABC</button>
        </div>
      </div>
      <div class="divider-line"></div>
      <div class="question-prompt" id="questionPrompt">Loading…</div>
      <div class="answer-choices" id="answerChoices"></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </aside>
  </main>

  <div class="dotted-border"></div>
  <footer class="test-footer">
    <div class="footer-user" id="footerUser">Loading…</div>
    <div class="question-indicator">Question 1 of 1</div>
    <button class="submit-btn" id="submitBtn" type="button" disabled>Submit Answer</button>
  </footer>

  <script>
    const fallbackQuestion = {
      id: 'demo-question',
      stimulus: 'Today’s SAT question will appear here after you add it to the Supabase questions table.',
      prompt: 'Which choice best answers the question?',
      choices: [
        { label: 'A', text: 'Answer choice A' },
        { label: 'B', text: 'Answer choice B' },
        { label: 'C', text: 'Answer choice C' },
        { label: 'D', text: 'Answer choice D' }
      ],
      imageUrl: null,
      timeLimitSeconds: 80,
      demo: true
    };

    let currentQuestion = null;
    let selectedAnswer = null;
    let timerInterval = null;
    let timeRemaining = null;

    const escapeHtml = (value) => {
      const node = document.createElement('span');
      node.textContent = value ?? '';
      return node.innerHTML;
    };

    async function loadUser() {
      if (new URLSearchParams(window.location.search).has('preview')) {
        document.getElementById('userProfile').innerHTML =
          '<span>Preview Student</span><div aria-hidden="true">👤</div>';
        document.getElementById('footerUser').textContent = 'Preview Student';
        return;
      }

      const response = await fetch('/api/me');
      if (!response.ok) {
        window.location.href = '/';
        return;
      }

      const { user } = await response.json();
      document.getElementById('userProfile').innerHTML = `
        <span>${escapeHtml(user.name)}</span>
        <img src="${user.avatar}" alt="${escapeHtml(user.name)}'s Discord avatar">
      `;
      document.getElementById('footerUser').textContent = user.name;
    }

    async function loadQuestion() {
      try {
        const response = await fetch('/api/question/today');
        if (!response.ok) throw new Error('No daily question');
        const { question } = await response.json();
        renderQuestion(question);
      } catch {
        renderQuestion(fallbackQuestion);
        setStatus('Add today’s question in Supabase to replace this preview.', 'error');
      }
    }

    function renderQuestion(question) {
      currentQuestion = question;
      document.getElementById('questionStimulus').textContent = question.stimulus;
      document.getElementById('questionPrompt').textContent = question.prompt;

      const image = document.getElementById('questionImage');
      if (question.imageUrl) {
        image.src = question.imageUrl;
        image.alt = 'Question figure';
        image.hidden = false;
      }

      const choices = document.getElementById('answerChoices');
      choices.innerHTML = '';
      question.choices.forEach((choice) => {
        const row = document.createElement('div');
        row.className = 'choice-row';
        row.innerHTML = `
          <div style="flex: 1">
            <button class="choice-option" type="button" data-answer="${escapeHtml(choice.label)}" style="width: 100%">
              <span class="choice-letter">${escapeHtml(choice.label)}</span>
              <span class="choice-text">${escapeHtml(choice.text)}</span>
            </button>
            <div class="choice-explanation" data-explanation="${escapeHtml(choice.label)}"></div>
          </div>
          <button class="eliminate-choice" type="button" aria-label="Eliminate ${escapeHtml(choice.label)}">×</button>
        `;

        const option = row.querySelector('.choice-option');
        option.addEventListener('click', () => selectAnswer(option, choice.label));
        row.querySelector('.eliminate-choice').addEventListener('click', () => {
          option.classList.toggle('eliminated');
          if (selectedAnswer === choice.label) {
            selectedAnswer = null;
            option.classList.remove('selected');
            document.getElementById('submitBtn').disabled = true;
          }
        });
        choices.appendChild(row);
      });

      startTimer(question.timeLimitSeconds);
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      const display = document.getElementById('timerDisplay');
      if (!Number.isInteger(seconds) || seconds <= 0) {
        display.hidden = true;
        return;
      }

      timeRemaining = seconds;
      display.hidden = false;

      const update = () => {
        const minutes = Math.floor(timeRemaining / 60);
        const remainingSeconds = timeRemaining % 60;
        display.textContent = `${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
        display.classList.toggle('warning', timeRemaining <= 15);

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById('submitBtn').disabled = true;
          document.querySelectorAll('.choice-option, .eliminate-choice')
            .forEach((item) => { item.disabled = true; });
          setStatus('Time is up. Your answer was not submitted.', 'error');
          return;
        }
        timeRemaining -= 1;
      };

      update();
      timerInterval = setInterval(update, 1000);
    }

    function selectAnswer(option, answer) {
      if (option.classList.contains('eliminated')) return;
      document.querySelectorAll('.choice-option').forEach((item) => item.classList.remove('selected'));
      option.classList.add('selected');
      selectedAnswer = answer;
      document.getElementById('submitBtn').disabled = false;
      setStatus('');
    }

    function setStatus(message, type = '') {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = `status ${type}`.trim();
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
      if (!selectedAnswer || currentQuestion.demo) {
        setStatus('This preview question cannot be submitted yet.', 'error');
        return;
      }

      const button = document.getElementById('submitBtn');
      button.disabled = true;
      setStatus('Saving your answer…');

      try {
        const response = await fetch('/api/answers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            questionId: currentQuestion.id,
            answer: selectedAnswer
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not submit answer');

        clearInterval(timerInterval);
        setStatus(
          result.correct
            ? `Correct! +${result.pointsAwarded} points`
            : `Incorrect. The correct answer was ${result.correctAnswer}.`,
          result.correct ? 'correct' : 'error'
        );
        document.querySelectorAll('.choice-option, .eliminate-choice')
          .forEach((item) => { item.disabled = true; });
        Object.entries(result.explanations || {}).forEach(([label, explanation]) => {
          const explanationElement =
            document.querySelector(`[data-explanation="${CSS.escape(label)}"]`);
          if (!explanationElement) return;
          explanationElement.textContent = `${label}: ${explanation}`;
          explanationElement.classList.add('visible');
          if (label === result.correctAnswer) explanationElement.classList.add('correct');
        });
      } catch (error) {
        setStatus(error.message, 'error');
        button.disabled = false;
      }
    });

    document.getElementById('bookmarkBtn').addEventListener('click', (event) => {
      event.currentTarget.classList.toggle('active');
      event.currentTarget.textContent =
        event.currentTarget.classList.contains('active')
          ? '♥ Marked for Review'
          : '♡ Mark for Review';
    });

    document.getElementById('eliminatorBtn').addEventListener('click', () => {
      document.getElementById('answerSidebar').classList.toggle('eliminating');
    });

    let dragging = false;
    const divider = document.getElementById('divider');
    const testContent = document.getElementById('testContent');
    divider.addEventListener('mousedown', () => { dragging = true; });
    document.addEventListener('mouseup', () => { dragging = false; });
    document.addEventListener('mousemove', (event) => {
      if (!dragging || window.innerWidth <= 768) return;
      const bounds = testContent.getBoundingClientRect();
      const leftWidth = event.clientX - bounds.left;
      if (leftWidth > bounds.width * .25 && leftWidth < bounds.width * .75) {
        testContent.style.gridTemplateColumns =
          `${leftWidth}px 4px ${bounds.width - leftWidth - 4}px`;
      }
    });

    document.getElementById('dateDisplay').textContent =
      new Date().toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric'
      });

    Promise.all([loadUser(), loadQuestion()]);
  </script>
</body>
</html>
