<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayo's SAT Leaderboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      background: #f5f0d8;
      color: #1a2b5e;
      font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive, sans-serif;
    }
    .page { width: min(760px, 100%); margin: 0 auto; }
    .header { margin-bottom: 1.5rem; text-align: center; }
    .brand {
      display: inline-block;
      margin-bottom: .4rem;
      color: #2c5aa0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 2px;
      transform: rotate(-2deg);
    }
    h1 { margin: .2rem 0; font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1.08; }
    .subtitle { margin: .6rem 0 1.3rem; color: #5a6a8a; }
    .home-link {
      display: inline-block;
      padding: .65rem 1.1rem;
      border: 2px solid #1a3a7a;
      border-radius: 12px;
      background: #2c5aa0;
      color: #fff;
      box-shadow: 0 5px 0 #1a3a7a;
      text-decoration: none;
      font-weight: 700;
    }
    .board {
      overflow: hidden;
      border: 3px solid #1a3a7a;
      border-radius: 18px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 10px 0 #1a3a7a, 0 16px 30px rgba(0, 0, 0, .15);
    }
    .row {
      min-height: 68px;
      padding: .75rem 1rem;
      display: grid;
      grid-template-columns: 48px 48px minmax(0, 1fr) auto;
      gap: .75rem;
      align-items: center;
      border-bottom: 1px solid #d9d7c8;
    }
    .row:last-child { border-bottom: 0; }
    .row.current { background: #e8efff; }
    .rank { text-align: center; font-size: 1.15rem; font-weight: 800; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
    .name { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .details { color: #5a6a8a; font-size: .77rem; }
    .score { text-align: right; color: #2c5aa0; font-size: 1.15rem; font-weight: 800; }
    .score small { display: block; color: #5a6a8a; font-size: .68rem; font-weight: 600; }
    .message { padding: 2rem; text-align: center; color: #5a6a8a; }
    @media (max-width: 520px) {
      .row { grid-template-columns: 36px 42px minmax(0, 1fr) auto; gap: .5rem; padding: .7rem; }
      .avatar { width: 40px; height: 40px; }
      .score { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="brand">MAYO'S</div>
      <h1>SAT Leaderboard</h1>
      <p class="subtitle">What the duck do?</p>
      <a class="home-link" href="/">Back Home</a>
    </header>

    <section class="board" id="board">
      <div class="message">Loading leaderboard…</div>
    </section>
  </main>

  <script>
    const escapeHtml = (value) => {
      const node = document.createElement('span');
      node.textContent = value ?? '';
      return node.innerHTML;
    };

    async function loadLeaderboard() {
      const [meResponse, leaderboardResponse] = await Promise.all([
        fetch('/api/me'),
        fetch('/api/leaderboard?limit=100')
      ]);

      if (!meResponse.ok) {
        window.location.href = '/';
        return;
      }
      if (!leaderboardResponse.ok) {
        document.getElementById('board').innerHTML =
          '<div class="message">The leaderboard could not be loaded.</div>';
        return;
      }

      const [{ user }, { leaderboard }] = await Promise.all([
        meResponse.json(),
        leaderboardResponse.json()
      ]);

      const board = document.getElementById('board');
      if (!leaderboard.length) {
        board.innerHTML = '<div class="message">No scores yet. Be the first!</div>';
        return;
      }

      board.innerHTML = leaderboard.map((entry, index) => {
        const rank = index + 1;
        return `
          <div class="row ${entry.discord_id === user.id ? 'current' : ''}">
            <div class="rank">${rank}</div>
            <img class="avatar" src="${entry.avatar_url}" alt="">
            <div>
              <div class="name">${escapeHtml(entry.display_name)}</div>
              <div class="details">${entry.questions_answered} question${entry.questions_answered === 1 ? '' : 's'} answered</div>
            </div>
            <div class="score">
              ${entry.total_score}
              <small>POINTS</small>
            </div>
          </div>
        `;
      }).join('');
    }

    loadLeaderboard().catch(() => {
      document.getElementById('board').innerHTML =
        '<div class="message">The leaderboard could not be loaded.</div>';
    });
  </script>
</body>
</html>
